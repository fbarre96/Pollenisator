[tool:pytest]
minversion = 7.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --cov=pollenisator
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
python_files = tests/*.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    performance: marks tests as performance tests
    auth: marks tests as authentication tests
    database: marks tests as database operations
    files: marks tests as file operations
    security: marks tests as security-related
    smoke: marks tests as smoke tests for quick validation
    throwabledb: marks tests using throwable database fixtures
    realdb: marks tests requiring real MongoDB instance
    mockdb: marks tests using mocked database
